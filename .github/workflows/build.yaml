name: Build and push

on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # registry.redhat.io requires a service account token.
      # Create one at https://access.redhat.com/terms-based-registry/
      # Store as RH_REGISTRY_USER (e.g. "12345678|servicename") and RH_REGISTRY_TOKEN.
      - name: Log in to registry.redhat.io
        uses: docker/login-action@v3
        with:
          registry: registry.redhat.io
          username: ${{ secrets.RH_REGISTRY_USER }}
          password: ${{ secrets.RH_REGISTRY_TOKEN }}

      - name: Build image
        id: build
        uses: redhat-actions/buildah-build@v2
        with:
          image: notebooklm-mcp
          tags: ${{ github.sha }}-${{ matrix.arch }}
          containerfiles: ./Containerfile
          platforms: linux/${{ matrix.arch }}
          # RHSM_ORG and RHSM_KEY passed as build secrets for optional subscription-manager
          # registration inside the RUN layer. Currently all packages install from
          # UBI AppStream + EPEL without registration, so these are a no-op but kept
          # for future packages that may require AppStream access.
          extra-args: |
            --secret id=rhsm_org,env=RHSM_ORG
            --secret id=rhsm_key,env=RHSM_KEY
        env:
          RHSM_ORG: ${{ secrets.RHSM_ORG }}
          RHSM_KEY: ${{ secrets.RHSM_KEY }}

      - name: Push per-arch image
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ghcr.io/${{ github.repository_owner }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write

    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/notebooklm-mcp
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=

      - name: Create and push multi-arch manifest
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/notebooklm-mcp"
          while IFS= read -r tag; do
            docker buildx imagetools create \
              -t "$tag" \
              "${IMAGE}:${{ github.sha }}-amd64" \
              "${IMAGE}:${{ github.sha }}-arm64"
          done <<< "${{ steps.meta.outputs.tags }}"
